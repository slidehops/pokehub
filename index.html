<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Pokédex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h1>Custom Pokédex</h1>

  <div class="input-area">
    <input id="pokemonInput" placeholder="pikachu or detective pikachu">

    <input id="cpInput" placeholder="CP" type="number" style="width:70px">
    <input id="hpInput" placeholder="HP" type="number" style="width:60px">
    <input id="attackInput" placeholder="ATK" type="number" style="width:55px">
    <input id="defenseInput" placeholder="DEF" type="number" style="width:55px">

    <!-- Location Background Dropdown -->
    <select id="locationSelect">
      <option value="">No Location Background</option>
    </select>

    <!-- Special Background Dropdown -->
    <select id="specialSelect">
      <option value="">No Special Background</option>
    </select>

    <!-- Category Dropdown -->
    <select id="categorySelect">
      <option value="shiny">Shiny</option>
      <option value="legendary">Legendary</option>
      <option value="mythical">Mythical</option>
      <option value="ultra">Ultra Beast</option>
      <option value="perfect">100% IV</option>
      <option value="costume">Costume</option>
      <option value="traded">Traded</option>
    </select>

    <button onclick="addPokemon()">Add</button>
    <button onclick="removeAll()">Remove All</button>
    <button onclick="saveDataToFile()">💾 Save Data</button>
    <button onclick="loadDataFromFile()">📂 Load Save</button>
    <button onclick="saveAsImage()">🖼 Save Image</button>
  </div>

  <!-- Pokedex sections by category -->
  <div id="pokedex">

    <div id="shiny-section">
      <h2>Shiny</h2>
      <div class="cards"></div>
    </div>

    <div id="legendary-section">
      <h2>Legendary</h2>
      <div class="cards"></div>
    </div>

    <div id="mythical-section">
      <h2>Mythical</h2>
      <div class="cards"></div>
    </div>

    <div id="ultra-section">
      <h2>Ultra Beast</h2>
      <div class="cards"></div>
    </div>

    <div id="perfect-section">
      <h2>100% IV</h2>
      <div class="cards"></div>
    </div>

    <div id="costume-section">
      <h2>Costume</h2>
      <div class="cards"></div>
    </div>

    <div id="traded-section">
      <h2>Traded</h2>
      <div class="cards"></div>
    </div>

  </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
